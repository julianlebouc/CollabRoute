<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabRoute — Le jeu de liaison des artistes</title>
    <meta name="description"
        content="Jouez à CollabRoute, le jeu pour relier les artistes à travers leurs collaborations musicales. Testez vos connaissances musicales dans ce jeu inédit !" />
    <meta name="keywords"
        content="CollabRoute, featurings, musique, artistes, collaborations, jeu musical, quiz musical, route musicale, deviner, spotify" />
    <meta name="author" content="Julian Lebouc" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://collabroute.cc/" />
    <meta property="og:title" content="CollabRoute — Reliez les artistes" />
    <meta property="og:description"
        content="Reliez les artistes à travers leurs collaborations musicales dans ce jeu inédit." />
    <meta property="og:image" content="/logo192.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://collabroute.cc/" />
    <meta property="twitter:title" content="CollabRoute — Reliez les artistes" />
    <meta property="twitter:description"
        content="Reliez les artistes à travers leurs collaborations musicales dans ce jeu inédit." />
    <meta property="twitter:image" content="/logo192.svg" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/logo192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Topographic contour-line background (drawn by topo-bg.js) -->
    <canvas id="topo-bg" aria-hidden="true"></canvas>

    <main class="app-container">

        <!-- ═══════════════════════════════════════════
             Écran de configuration
        ═══════════════════════════════════════════ -->
        <section id="setup-screen" class="screen active">
            <div class="setup-content">
                <header class="setup-header">
                    <h1>CollabRoute</h1>
                    <p>Reliez les artistes à travers leurs collaborations musicales.</p>
                </header>

                <form id="setup-form" class="minimal-form">
                    <div class="form-group">
                        <label for="country">Pays</label>
                        <select id="country" name="country">
                            <option value="any">Tous les pays</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="min-followers">
                            Followers Deezer min. (<span id="followers-value">1M</span>)
                        </label>
                        <input type="range" id="min-followers" name="min_followers" min="50000" max="2000000"
                            step="50000" value="1000000">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="min-range">Liens min. (<span id="min-range-value">1</span>)</label>
                            <input type="range" id="min-range" name="min_range" min="1" max="10" value="1">
                        </div>
                        <div class="form-group half">
                            <label for="max-range">Liens max. (<span id="max-range-value">3</span>)</label>
                            <input type="range" id="max-range" name="max_range" min="1" max="10" value="3">
                        </div>
                    </div>

                    <!-- Sélecteur de difficulté -->
                    <div class="form-group">
                        <label>Mode de jeu</label>
                        <div class="difficulty-cards" id="difficulty-cards" role="radiogroup" aria-label="Mode de jeu">
                            <button type="button" class="difficulty-card difficulty-card--selected" id="diff-easy"
                                data-difficulty="easy" role="radio" aria-checked="true">
                                <span class="difficulty-card__title">Facile</span>
                                <span class="difficulty-card__desc">Choix parmi les collaborateurs • Distance affichée •
                                    Indice 1 gratuit</span>
                            </button>
                            <button type="button" class="difficulty-card" id="diff-normal" data-difficulty="normal"
                                role="radio" aria-checked="false">
                                <span class="difficulty-card__title">Normal</span>
                                <span class="difficulty-card__desc">Recherche libre • Distance affichée • Indice 1
                                    gratuit</span>
                            </button>
                            <button type="button" class="difficulty-card" id="diff-hard" data-difficulty="hard"
                                role="radio" aria-checked="false">
                                <span class="difficulty-card__title">Difficile</span>
                                <span class="difficulty-card__desc">Recherche libre • Pas d'aide • Indices
                                    payants</span>
                            </button>
                        </div>
                        <!-- Champ caché pour transmettre la difficulté -->
                        <input type="hidden" id="difficulty-input" name="difficulty" value="easy">
                    </div>

                    <div class="action-bar">
                        <button type="submit" class="btn-solid" id="start-btn">
                            <span class="btn-text">Générer une route</span>
                            <span class="loader hidden"></span>
                        </button>
                    </div>
                    <div id="setup-error" class="error-msg"></div>
                </form>
            </div>
        </section>

        <!-- ═══════════════════════════════════════════
             Écran de jeu
        ═══════════════════════════════════════════ -->
        <section id="game-screen" class="screen">
            <header class="game-header">
                <button id="reset-btn" class="btn-text" aria-label="Nouvelle partie">
                    &larr; Retour
                </button>
                <div class="target-header">
                    <div class="target-container">
                        <span class="target-label">Score :</span>
                        <h2 id="score-value" class="target-value">0</h2>
                    </div>
                    <!-- Badge distance — visible uniquement en easy/normal -->
                    <div class="target-container" id="distance-container" style="display:none">
                        <span class="target-label">Distance restante :</span>
                        <h2 id="distance-value" class="target-value">—</h2>
                    </div>
                    <!-- Badge mode de jeu -->
                    <div class="target-container">
                        <span class="target-label">Mode :</span>
                        <h2 id="mode-badge" class="target-value mode-badge">—</h2>
                    </div>
                </div>
            </header>

            <div class="game-content">
                <!-- Timeline du chemin parcouru -->
                <div class="path-timeline" id="path-container"></div>

                <div class="search-section">
                    <!-- Mode Easy : grille de collaborateurs cliquables -->
                    <div id="collaborators-section" class="collaborators-section hidden">
                        <p class="collaborators-label">Choisissez un collaborateur :</p>
                        <div id="collaborators-grid" class="collaborators-grid"></div>
                    </div>

                    <!-- Mode Normal / Hard : barre de recherche -->
                    <div id="search-wrapper-section" class="search-wrapper">
                        <input type="text" id="artist-search" placeholder="Rechercher une collaboration..."
                            autocomplete="off">
                        <ul id="search-results" class="search-dropdown hidden"></ul>
                    </div>

                    <!-- Barre d'indices : séquentiels, sous la recherche -->
                    <div class="hints-bar" role="group" aria-label="Indices disponibles">
                        <span class="hints-bar__label">Indices :</span>
                        <div id="hint-buttons" class="hints-bar__buttons">
                            <!-- Injecté dynamiquement par hints.js -->
                        </div>
                    </div>

                    <!-- Réponse de l'indice -->
                    <div id="hint-display" class="hint-display hidden" aria-live="polite"></div>

                    <!-- Feedback guess -->
                    <div id="guess-feedback" class="feedback-msg"></div>
                </div>
            </div>

            <!-- Modale de Victoire -->
            <div id="victory-modal" class="modal hidden">
                <div class="modal-dialog">
                    <h2 class="modal-title">Félicitations !</h2>
                    <p class="modal-desc">Vous avez réussi à relier les deux artistes.</p>
                    <p id="final-score" class="modal-desc"></p>
                    <button class="btn-solid modal-btn" id="play-again-btn">Rejouer</button>
                </div>
            </div>
        </section>

    </main>

    <!--
        Ordre de chargement important :
        1. api.js     — aucune dépendance
        2. game.js    — dépend de HintsModule (via window, évalué à runtime)
        3. hints.js   — dépend de Api
        4. app.js     — orchestrateur, dépend de Api + Game + HintsModule
    -->
    <script src="js/topo-bg.js"></script>
    <script src="js/api.js"></script>
    <script src="js/game.js"></script>
    <script src="js/hints.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
